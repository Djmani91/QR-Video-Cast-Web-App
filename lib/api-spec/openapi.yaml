openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: casting
    description: Short-lived signaling for direct phone-to-TV video casting.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /cast/rooms:
    post:
      operationId: createCastRoom
      tags: [casting]
      summary: Create a temporary casting room
      description: Creates an in-memory pairing room. No video is sent to this API.
      responses:
        "201":
          description: Temporary room created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CastRoom"
        "503":
          description: Room capacity is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /cast/rooms/lookup:
    post:
      operationId: lookupCastRoomByCode
      tags: [casting]
      summary: Find an active room from its five-digit pairing code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CastRoomLookupInput"
      responses:
        "200":
          description: Active room found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CastRoomLookupResponse"
        "404":
          description: Code is invalid or the room has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many code attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /cast/rooms/{roomId}/messages:
    get:
      operationId: getCastRoomMessages
      tags: [casting]
      summary: Read new connection messages for one peer
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Temporary room negotiation messages and the room's idle expiry. Peers filter by sequence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CastRoomMessagesResponse"
        "404":
          description: Room not found or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: sendCastRoomMessage
      tags: [casting]
      summary: Send a temporary WebRTC negotiation message
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CastSignalInput"
      responses:
        "201":
          description: Message accepted for temporary delivery to the other peer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CastSignalReceipt"
        "400":
          description: Invalid message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Room not found or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CastRole:
      type: string
      enum: [tv, phone]
    CastSignalType:
      type: string
      enum: [offer, answer, ice, ready, close, local-video, player-command, player-state]
    CastRoom:
      type: object
      required: [id, code, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 5
          maxLength: 5
          pattern: "^[0-9]{5}$"
        expiresAt:
          type: string
          format: date-time
    CastRoomLookupInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 5
          maxLength: 5
          pattern: "^[0-9]{5}$"
    CastRoomLookupResponse:
      type: object
      required: [roomId]
      properties:
        roomId:
          type: string
          format: uuid
    CastSignalPayload:
      type: object
      additionalProperties: true
      properties:
        sessionId:
          type: string
        receiverUrl:
          type: string
        extension:
          type: string
        action:
          type: string
        currentTime:
          type: number
        duration:
          type: number
        volume:
          type: number
        paused:
          type: boolean
        playback:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [offer, answer]
        sdp:
          type: string
        mediaKind:
          type: string
          enum: [video, image]
        transport:
          type: string
          enum: [data-channel, track]
        mediaSource:
          type: string
          enum: [screen]
        candidate:
          type: string
        sdpMid:
          type: [string, "null"]
        sdpMLineIndex:
          type: [integer, "null"]
        usernameFragment:
          type: [string, "null"]
    CastSignal:
      type: object
      required: [sequence, from, type, payload]
      properties:
        sequence:
          type: integer
        from:
          $ref: "#/components/schemas/CastRole"
        type:
          $ref: "#/components/schemas/CastSignalType"
        payload:
          $ref: "#/components/schemas/CastSignalPayload"
    CastRoomMessagesResponse:
      type: object
      required: [messages, expiresAt]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/CastSignal"
        expiresAt:
          type: string
          format: date-time
    CastSignalInput:
      type: object
      required: [from, type, payload]
      properties:
        from:
          $ref: "#/components/schemas/CastRole"
        type:
          $ref: "#/components/schemas/CastSignalType"
        payload:
          $ref: "#/components/schemas/CastSignalPayload"
    CastSignalReceipt:
      type: object
      required: [sequence]
      properties:
        sequence:
          type: integer
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

