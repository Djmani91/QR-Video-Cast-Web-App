kind = "web"
previewPath = "/"
title = "FrameCast"
description = "A browser-based video handoff app: pair a smart TV screen with a phone using a QR code, upload a video from the phone, and play it on the TV."
version = "1.0.0"
id = "artifacts/framecast"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19931

[services.development]
run = "pnpm --filter @workspace/framecast run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/framecast", "run", "build" ]
serve = "static"
publicDir = "artifacts/framecast/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19931"
BASE_PATH = "/"
